name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Check if only docs/config files changed (skip integration tests if so)
  check-changes:
    name: Check Changes
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.check.outputs.has-code-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for code changes
        id: check
        uses: ./.github/actions/check-file-changes
        with:
          # Files that DON'T require integration tests (docs, config, planning, CI)
          safe-patterns: '^(.*\.md|_tasks/.*|\.claude/.*|\.github/.*|docs/.*)$'

  # Backend tests - fast, run on all platforms.
  # The matrix stays at three platforms on purpose: the crate still has
  # platform-conditional code (DB path resolution, hostname, the
  # #[cfg(unix)] / #[cfg(not(unix))] shutdown handler) that developers build
  # and run on Windows and macOS.
  # Skip on main if only docs/config changed; always run on PRs
  backend-tests:
    name: Backend Tests (${{ matrix.platform }})
    needs: check-changes
    if: github.event_name == 'pull_request' || needs.check-changes.outputs.run_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Run backend tests
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Verify web binary builds
        working-directory: src-tauri
        run: cargo build --release -p kniha-jazd-web

  # Docker image build - runs once, then all tier matrix jobs reuse the image artifact.
  # The image builds its own release `web` binary in-stage and runs on Linux.
  integration-build-docker:
    name: Docker Image Build
    needs: check-changes
    if: needs.check-changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          tags: kniha-jazd-web:test
          outputs: type=docker,dest=/tmp/kniha-jazd-web.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/kniha-jazd-web.tar
          retention-days: 1

  # Docker integration tests (Chrome against containerized web binary)
  # One job per tier, in parallel.
  integration-test-docker:
    name: Integration Tests (Docker/Chrome - ${{ matrix.tier_name }})
    needs: [check-changes, integration-build-docker]
    if: needs.check-changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: '1'
            tier_name: 'Tier 1'
          - tier: '2'
            tier_name: 'Tier 2'
          - tier: '3'
            tier_name: 'Tier 3'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install npm dependencies
        run: npm ci

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/kniha-jazd-web.tar

      - name: Start container
        run: |
          mkdir -p data
          docker run -d --name kniha-jazd-web \
            --network=host \
            -v "$PWD/data:/data" \
            -v "$PWD/tests/integration/data:/testdata:ro" \
            -e KNIHA_JAZD_DATA_DIR=/data \
            -e DATABASE_PATH=/data/kniha-jazd.db \
            -e KNIHA_JAZD_MOCK_GEMINI_DIR=/testdata/mocks \
            -e PORT=3456 \
            kniha-jazd-web:test

      - name: Wait for server health
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3456/health >/dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not become healthy within 60s"
          docker logs kniha-jazd-web
          exit 1

      - name: Run Docker integration tests (${{ matrix.tier_name }})
        env:
          TIER: ${{ matrix.tier }}
          WDIO_EXTERNAL_SERVER: '1'
          PARALLEL_TIERS: 'true'
        run: npm run test:integration:docker

      - name: Show container logs on failure
        if: failure()
        run: docker logs kniha-jazd-web || true

      - name: Tear down container
        if: always()
        run: docker rm -f kniha-jazd-web || true

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots-docker-${{ matrix.tier_name }}
          path: tests/integration/screenshots/
          if-no-files-found: ignore

  # Env-pinned settings suite - needs the fixture variables present when the
  # server process starts, so it gets its own container. Never ran in CI before
  # Task 73; see _tasks/73-web-first-migration/02-research.md section 3.2.
  integration-test-docker-env:
    name: Integration Tests (Docker/Chrome - Env-Pinned)
    needs: [check-changes, integration-build-docker]
    if: needs.check-changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install npm dependencies
        run: npm ci

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/kniha-jazd-web.tar

      # Values mirror ENV_PINNED_FIXTURE in tests/integration/wdio.server.conf.ts.
      # The hosts do not have to resolve - the assertions only check the fields are pinned.
      - name: Start env-pinned container
        run: |
          mkdir -p data-env
          docker run -d --name kniha-jazd-web-env \
            --network=host \
            -v "$PWD/data-env:/data" \
            -v "$PWD/tests/integration/data:/testdata:ro" \
            -e KNIHA_JAZD_DATA_DIR=/data \
            -e DATABASE_PATH=/data/kniha-jazd.db \
            -e KNIHA_JAZD_MOCK_GEMINI_DIR=/testdata/mocks \
            -e PORT=3456 \
            -e HA_URL=http://env-pinned-ha.test:8123 \
            -e HA_API_TOKEN=env-pinned-ha-token \
            -e PAPERLESS_URL=https://env-pinned-paperless.test \
            -e PAPERLESS_API_TOKEN=env-pinned-paperless-token \
            -e PAPERLESS_ENABLED=true \
            -e KNIHA_JAZD_REVEAL_PIN=4269 \
            kniha-jazd-web:test

      - name: Wait for server health
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:3456/health >/dev/null; then
              echo "Server is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not become healthy within 60s"
          docker logs kniha-jazd-web-env
          exit 1

      # The env: block is NOT redundant with the npm script. The scripts use
      # Windows `set X=Y&&`, which under sh sets positional parameters and exports
      # nothing - so on ubuntu the wdio config would see EXTERNAL_SERVER=false,
      # run all four tier globs instead of ./specs/env/**, and try to spawn a
      # binary CI never built. The existing docker job passes them the same way.
      - name: Run env-pinned integration tests
        env:
          WDIO_EXTERNAL_SERVER: '1'
          WDIO_ENV_PINNED: '1'
        run: npm run test:integration:docker:env

      - name: Show container logs on failure
        if: failure()
        run: docker logs kniha-jazd-web-env || true

      - name: Tear down container
        if: always()
        run: docker rm -f kniha-jazd-web-env || true

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-screenshots-docker-env
          path: tests/integration/screenshots/
          if-no-files-found: ignore
