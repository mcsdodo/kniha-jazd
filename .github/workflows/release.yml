name: Release

on:
  push:
    tags:
      - 'v*'

# A `v*` tag does not build anything (ADR-051). It:
#   1. reads the `## [X.Y.Z]` section of CHANGELOG.md - no section, no release;
#   2. waits for test.yml to finish on the tagged commit - test.yml runs the full
#      suite and publishes `:main-<short-sha>` for every push to main (ADR-031);
#   3. promotes that tested image to `:vX.Y.Z` and `:latest` with
#      `imagetools create`, so the released bytes are the bytes the suite passed;
#   4. creates a GitHub Release that holds the changelog section and no assets.
#
# `:main` and `:main-<sha>` are owned by test.yml and are NOT touched here.

jobs:
  release:
    name: Promote Tested Image and Publish Notes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # gh release create
      packages: write   # push vX.Y.Z and latest
      actions: read     # read the test.yml run of the tagged commit
    env:
      IMAGE: ghcr.io/mcsdodo/kniha-jazd-web
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail before the wait: a tag without notes must not publish an image.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Run /release, which writes it."
            exit 1
          fi
          if ! grep -q '^### Pokyny k aktualizácii' release-notes.md; then
            echo "::error::The '## [$VERSION]' section has no '### Pokyny k aktualizácii' block for the integrator."
            exit 1
          fi

      - name: Wait for test.yml on the tagged commit
        id: tested
        run: |
          SHA=$(git rev-parse HEAD)   # checkout leaves HEAD on the tagged commit
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Tagged commit: $SHA"

          # 50 x 60 s. A tag on a commit that was never pushed to main gets no run.
          for i in $(seq 1 50); do
            RUN=$(gh api \
              "/repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=$SHA&event=push" \
              --jq '.workflow_runs | sort_by(.created_at) | last | "\(.status) \(.conclusion) \(.html_url)"' \
              2>/dev/null || echo "")

            case "$RUN" in
              "completed success "*)
                echo "test.yml passed: ${RUN##* }"
                exit 0 ;;
              completed*)
                echo "::error::test.yml did not pass on $SHA: $RUN"
                exit 1 ;;
              "" | null*)
                echo "[$i] no test.yml run for $SHA yet" ;;
              *)
                echo "[$i] test.yml is $RUN" ;;
            esac
            sleep 60
          done

          echo "::error::No finished test.yml run for $SHA. Tag a commit that you pushed to main."
          exit 1

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote the tested image
        run: |
          SOURCE="$IMAGE:main-${{ steps.tested.outputs.short }}"

          # publish-main-image is the last job of test.yml, so the image exists
          # when the run is green. Fail with a clear message if it does not.
          if ! docker buildx imagetools inspect "$SOURCE" > /dev/null; then
            echo "::error::$SOURCE does not exist, although test.yml passed."
            exit 1
          fi

          # --prefer-index=false: copy the manifest as it is. The default (true)
          # wraps a single-platform source in a new index with a new digest.
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:$GITHUB_REF_NAME" \
            --tag "$IMAGE:latest" \
            "$SOURCE"

          # Same digest = same bytes as the image the suite passed against.
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          SRC_DIGEST=$(digest "$SOURCE")
          for TAG in "$GITHUB_REF_NAME" latest; do
            if [ "$(digest "$IMAGE:$TAG")" != "$SRC_DIGEST" ]; then
              echo "::error::$IMAGE:$TAG has a different digest than $SOURCE ($SRC_DIGEST)."
              exit 1
            fi
          done

          echo "Promoted \`$SOURCE\` ($SRC_DIGEST) to \`$IMAGE:$GITHUB_REF_NAME\` and \`$IMAGE:latest\`." \
            >> "$GITHUB_STEP_SUMMARY"

      # Notes only, no assets. `--latest` moves the GitHub "Latest" marker off the
      # last desktop release.
      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
